name: Release (version)

on:
  push:
    branches: [main]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4

      - name: Detect version change
        id: detect
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "0.0.0")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT). Nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PREVIOUS -> $CURRENT"
          fi

      - name: Check if tag exists
        id: check
        if: steps.detect.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.detect.outputs.current }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — aborting to avoid overwriting."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is free — proceeding with release."
          fi

      - name: Build and pack
        if: steps.detect.outputs.changed == 'true' && steps.check.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run release

      - name: Create and push tag
        if: steps.detect.outputs.changed == 'true' && steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.detect.outputs.current }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.detect.outputs.changed == 'true' && steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.detect.outputs.current }}
          name: v${{ steps.detect.outputs.current }}
          generate_release_notes: true
          files: |
            dist/*.mcpb
            dist/*.zip
